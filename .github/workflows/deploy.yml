name: Hexo Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Generate Hexo
      run: npx hexo generate

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public